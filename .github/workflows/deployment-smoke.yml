name: Deployment Smoke

on:
  push:
    branches: [pmv-validation-candidate]
  workflow_dispatch:
    inputs:
      base_url:
        description: Vercel Preview URL (leave empty to use the candidate branch alias)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-smoke-pmv-candidate
  cancel-in-progress: true

jobs:
  smoke:
    name: Live Preview E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://grupo-comunicarte-refactoring-git-pmv-1fe190-popnegros-projects.vercel.app' }}
      E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build expected frontend artifact
        run: npm run build

      - name: Wait for this exact candidate deployment to reach Vercel Preview
        shell: bash
        run: |
          expected_asset="$(grep -oE '/assets/[^\"]+\\.js' dist/index.html | head -1)"
          if [ -z "$expected_asset" ]; then
            echo "Could not determine the expected frontend asset from dist/index.html"
            exit 1
          fi

          echo "Waiting for commit $EXPECTED_COMMIT_SHA at $PLAYWRIGHT_BASE_URL"
          for attempt in $(seq 1 60); do
            html="$(curl --silent --show-error --fail --max-time 15 "$PLAYWRIGHT_BASE_URL/" 2>/dev/null || true)"
            health="$(curl --silent --show-error --fail --max-time 15 "$PLAYWRIGHT_BASE_URL/api/health" 2>/dev/null || true)"
            if [ -n "$health" ]; then
              read -r actual_commit database_status < <(node -e 'const h=JSON.parse(process.argv[1]); console.log(`${h.commit || ""} ${h.database || ""}`)' "$health" 2>/dev/null || true)
              if [[ "$actual_commit" == "$EXPECTED_COMMIT_SHA" && "$database_status" == "connected" && "$html" == *"$expected_asset"* ]]; then
                echo "Preview serves exact commit $EXPECTED_COMMIT_SHA with a connected database."
                exit 0
              fi
            fi
            sleep 10
          done

          echo "Preview did not serve exact commit $EXPECTED_COMMIT_SHA with a connected database within 10 minutes."
          exit 1

      - name: Run deployment smoke and PMV E2E
        run: npx playwright test --config=playwright.deployment.config.ts

      - name: Upload deployment QA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: deployment-smoke-evidence
          path: |
            test-results/deployment/
            playwright-report/
          retention-days: 14
