name: Visual QA

on:
  pull_request:
    branches: [main, pmv-validation-candidate, pmv-production-refinement, 'feat/**']
  push:
    branches: [main, pmv-validation-candidate, pmv-production-refinement]

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual QA
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 0.0.0.0 > /tmp/gc-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

      - name: Restore visual baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: tests/visual/__snapshots__
          key: visual-baseline-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            visual-baseline-${{ github.event.pull_request.head.ref || github.ref_name }}-

      - name: Bootstrap missing baseline
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-matched-key == ''
        run: npx playwright test --update-snapshots

      - name: Validate bootstrapped baseline
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-matched-key == ''
        run: npx playwright test

      - name: Summarize baseline bootstrap
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-matched-key == ''
        run: |
          echo "## Visual QA: baseline bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "No cached baseline was available for this PR branch. Playwright validates the snapshots committed with the candidate and generates only missing snapshots; this first run establishes the branch baseline. Snapshot changes remain visible in the PR diff." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize visual regression comparison
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-matched-key != ''
        run: |
          echo "## Visual QA: baseline comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "The Playwright visual tests are comparing against the previous trusted snapshot cache for this candidate branch: ${{ steps.baseline.outputs.cache-matched-key }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Run visual regression
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-matched-key != ''
        run: npx playwright test

      - name: Bootstrap trusted baseline and validate Playwright
        if: github.event_name == 'push' && steps.baseline.outputs.cache-matched-key == ''
        run: |
          npx playwright test --update-snapshots=all
          npx playwright test
          {
            echo "## Visual QA: trusted baseline bootstrap"
            echo "No previous trusted-branch baseline was available. Playwright tests passed against newly generated snapshots; this run establishes a baseline but is not a regression comparison."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh manually reviewed visual snapshots
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'visual-baseline:')
        run: |
          npx playwright test --update-snapshots=changed
          npx playwright test
          {
            echo "## Visual QA: reviewed baseline refresh"
            echo "Only changed snapshots were refreshed by an explicitly named visual-baseline commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save PR baseline after visual QA
        if: github.event_name == 'pull_request' && success()
        uses: actions/cache/save@v4
        with:
          path: tests/visual/__snapshots__
          key: visual-baseline-${{ github.event.pull_request.head.ref }}-${{ github.sha }}

      - name: Compare against previous trusted baseline
        if: github.event_name == 'push' && steps.baseline.outputs.cache-matched-key != '' && !startsWith(github.event.head_commit.message, 'visual-baseline:')
        run: |
          npx playwright test
          {
            echo "## Visual QA: trusted baseline regression"
            echo "Playwright passed against the previously cached trusted-branch baseline: ${{ steps.baseline.outputs.cache-matched-key }}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save trusted baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: tests/visual/__snapshots__
          key: visual-baseline-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: visual-qa-report
          path: |
            playwright-report/
            test-results/visual/
            tests/visual/__snapshots__/
            /tmp/gc-preview.log
          retention-days: 14
