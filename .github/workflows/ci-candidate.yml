name: CI Candidate

on:
  pull_request:
    branches: [main, pmv-validation-candidate]
  push:
    branches:
      - pmv-validation-candidate
      - canonical-candidate
      - canonical-refinement

# This workflow executes pull-request-controlled code. Never grant write access.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate semver-compatible audit remediation lockfile
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'audit-remediation:')
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload audit remediation lockfile
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'audit-remediation:')
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediation-lockfile
          path: package-lock.json
          retention-days: 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  authenticated-preview-smoke:
    name: Authenticated Preview Smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/pmv-validation-candidate'
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: https://grupo-comunicarte-refactoring-git-pmv-1fe190-popnegros-projects.vercel.app
      E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout trusted candidate push
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build expected frontend artifact
        run: npm run build

      - name: Wait for exact Vercel Preview commit
        shell: bash
        run: |
          expected_asset="$(grep -oE '/assets/[^"]+\\.js' dist/index.html | head -1)"
          if [ -z "$expected_asset" ]; then
            echo "Could not determine the expected frontend asset from dist/index.html"
            exit 1
          fi

          echo "Waiting for exact Preview commit $EXPECTED_COMMIT_SHA"
          for attempt in $(seq 1 60); do
            html="$(curl --silent --show-error --fail --max-time 15 "$PLAYWRIGHT_BASE_URL/" 2>/dev/null || true)"
            health="$(curl --silent --show-error --fail --max-time 15 "$PLAYWRIGHT_BASE_URL/api/health" 2>/dev/null || true)"
            if [ -n "$health" ]; then
              read -r actual_commit database_status < <(node -e 'const h=JSON.parse(process.argv[1]); console.log(`${h.commit || ""} ${h.database || ""}`)' "$health" 2>/dev/null || true)
              if [[ "$actual_commit" == "$EXPECTED_COMMIT_SHA" && "$database_status" == "connected" && "$html" == *"$expected_asset"* ]]; then
                echo "Preview serves exact commit with a connected database."
                exit 0
              fi
            fi
            sleep 10
          done

          echo "Preview did not serve the exact commit with a connected database."
          exit 1

      - name: Verify public smoke, authenticated dashboard and admin API
        run: npx playwright test --config=playwright.deployment.config.ts
