name: CI Candidate

on:
  pull_request:
    branches: [main, pmv-validation-candidate]
  push:
    branches:
      - pmv-validation-candidate
      - canonical-candidate
      - canonical-refinement

# Every candidate run validates its own immutable commit and never reuses a pinned Preview URL.
concurrency:
  group: ci-candidate-${{ github.ref }}
  cancel-in-progress: true

# This workflow executes repository code. Grant only read access needed to resolve GitHub deployment records.
permissions:
  contents: read
  deployments: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate semver-compatible audit remediation lockfile
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'audit-remediation:')
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload audit remediation lockfile
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'audit-remediation:')
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediation-lockfile
          path: package-lock.json
          retention-days: 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  authenticated-preview-smoke:
    name: Authenticated Preview Smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/pmv-validation-candidate'
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build expected frontend artifact
        run: npm run build

      - name: Resolve and verify the exact READY Vercel Preview for this SHA
        id: preview
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const expectedSha = process.env.EXPECTED_SHA;
          const expectedRef = process.env.EXPECTED_REF;
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const apiBase = `https://api.github.com/repos/${repository}`;

          if (!/^[0-9a-f]{40}$/i.test(expectedSha || '') || !expectedRef || !token) {
            throw new Error('Missing or invalid GitHub deployment verification inputs.');
          }

          async function github(path) {
            const response = await fetch(`${apiBase}${path}`, {
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              },
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`GitHub API ${response.status}: ${body.slice(0, 500)}`);
            }
            return response.json();
          }

          async function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          let lastState = 'no matching Preview deployment found';
          for (let attempt = 1; attempt <= 30; attempt++) {
            const query = new URLSearchParams({
              sha: expectedSha,
              ref: expectedRef,
              environment: 'Preview',
              per_page: '100'
            });
            const deployments = await github(`/deployments?${query}`);
            const matching = deployments
              .filter(item =>
                item.sha === expectedSha &&
                item.ref === expectedRef &&
                String(item.environment).toLowerCase() === 'preview'
              )
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (matching.length) {
              const deployment = matching[0];
              const statuses = await github(`/deployments/${deployment.id}/statuses?per_page=100`);
              const latest = statuses[0];
              lastState = latest?.state || 'deployment has no status';

              if (latest?.state === 'success' && latest.environment_url) {
                const previewUrl = new URL(latest.environment_url);
                if (previewUrl.protocol !== 'https:' || !previewUrl.hostname.endsWith('.vercel.app')) {
                  throw new Error('GitHub returned a non-Preview or untrusted deployment URL.');
                }

                const expectedAsset = (fs.readFileSync('dist/index.html', 'utf8').match(/\/assets\/[^"]+\.js/) || [])[0];
                if (!expectedAsset) throw new Error('Could not identify the built frontend asset.');

                let runtimeReady = false;
                for (let healthAttempt = 1; healthAttempt <= 12; healthAttempt++) {
                  try {
                    const [healthResponse, pageResponse] = await Promise.all([
                      fetch(new URL('/api/health', previewUrl), { signal: AbortSignal.timeout(15000) }),
                      fetch(previewUrl, { signal: AbortSignal.timeout(15000) })
                    ]);
                    if (healthResponse.ok && pageResponse.ok) {
                      const health = await healthResponse.json();
                      const html = await pageResponse.text();
                      if (
                        health.commit === expectedSha &&
                        health.database === 'connected' &&
                        html.includes(expectedAsset)
                      ) {
                        runtimeReady = true;
                        break;
                      }
                    }
                  } catch {
                    // A successful deployment status can precede runtime readiness briefly.
                  }
                  await sleep(5000);
                }

                if (runtimeReady) {
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${previewUrl.origin}\n`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${deployment.id}\n`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${expectedSha}\n`);
                  console.log(`Verified Preview deployment ${deployment.id} for exact SHA ${expectedSha}.`);
                  console.log('Health endpoint, connected database, and frontend asset all match this candidate.');
                  process.exit(0);
                }
                lastState = 'deployment succeeded, but runtime SHA/health/frontend asset did not match';
              }
            }

            console.log(`Preview for ${expectedSha}: attempt ${attempt}/30; latest state: ${lastState}`);
            await sleep(20000);
          }

          throw new Error(`No READY Vercel Preview matched branch ${expectedRef} and SHA ${expectedSha}. Last state: ${lastState}`);
          NODE

      - name: Verify QA credentials are configured
        shell: bash
        env:
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [[ -z "$E2E_ADMIN_USER" || -z "$E2E_ADMIN_PASSWORD" ]]; then
            echo "::error::E2E_ADMIN_USER and E2E_ADMIN_PASSWORD must be configured to claim authenticated QA."
            exit 1
          fi
          echo "QA credentials are present; values are intentionally not logged."

      - name: Verify public smoke, authenticated dashboard and admin API
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test --config=playwright.deployment.config.ts --grep-invert "ownership, tenant spoofing, quarantine and pricing remain fail-closed|PDF/PPTX se persisten, se recuperan con autorización y la entrega queda auditada"
