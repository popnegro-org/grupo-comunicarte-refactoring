name: CI Candidate

on:
  pull_request:
    branches: [main, pmv-validation-candidate]
  push:
    branches:
      - pmv-validation-candidate
      - canonical-candidate
      - canonical-refinement

# Every candidate run validates its own immutable commit and never reuses a pinned Preview URL.
concurrency:
  group: ci-candidate-${{ github.ref }}
  cancel-in-progress: true

# This workflow executes repository code. Grant only read access needed to resolve GitHub deployment records.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Generate semver-compatible audit remediation lockfile
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'audit-remediation:')
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload audit remediation lockfile
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'audit-remediation:')
        uses: actions/upload-artifact@v5
        with:
          name: audit-remediation-lockfile
          path: package-lock.json
          retention-days: 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  authenticated-preview-smoke:
    name: Authenticated Preview Smoke
    # Read-only smoke can run for both branch pushes and same-repository PRs.
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/pmv-validation-candidate') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'pmv-validation-candidate' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect runtime changes in this commit
        id: runtime
        shell: bash
        run: |
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed_files" | grep -Eq '^(src/|api/|server\.ts$|public/|drizzle/|scripts/|package\.json$|package-lock\.json$|vite\.config\.[^/]+$|tsconfig[^/]*\.json$|index\.html$|vercel\.json$|postcss\.config\.[^/]+$|tailwind\.config\.[^/]+$|\.npmrc$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Runtime files changed; exact-SHA Preview smoke is required."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No runtime files changed; reusing the previously verified Preview deployment."
          fi

      - name: Skip Preview deployment smoke for test/documentation-only commits
        if: steps.runtime.outputs.required != 'true'
        run: echo "No runtime changes in this commit; no new Vercel deployment is required."

      - name: Setup Node
        if: steps.runtime.outputs.required == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.runtime.outputs.required == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build expected frontend artifact
        if: steps.runtime.outputs.required == 'true'
        run: npm run build

      - name: Wait for stable Vercel branch alias to serve the exact candidate SHA
        if: steps.runtime.outputs.required == 'true'
        id: preview
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          node <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const expectedSha = process.env.EXPECTED_SHA;
          const expectedRef = process.env.EXPECTED_REF;
          // Stable branch alias; health.commit is the authoritative deployment identity.
          const previewUrl = new URL('https://grupo-comunicarte-refactoring-git-pmv-1fe190-popnegros-projects.vercel.app');

          if (!/^[0-9a-f]{40}$/i.test(expectedSha || '') || expectedRef !== 'pmv-validation-candidate') {
            throw new Error('Missing or invalid candidate SHA/branch.');
          }

          const expectedAsset = readFileSync('dist/index.html', 'utf8').split('"').find(value => value.startsWith('/assets/') && value.endsWith('.js'));
          if (!expectedAsset) throw new Error('Could not identify the built frontend asset.');

          async function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          let lastObservedCommit = 'unavailable';
          for (let attempt = 1; attempt <= 60; attempt++) {
            try {
              const [healthResponse, pageResponse] = await Promise.all([
                fetch(new URL('/api/health', previewUrl), { signal: AbortSignal.timeout(15000) }),
                fetch(previewUrl, { signal: AbortSignal.timeout(15000) })
              ]);

              if (healthResponse.ok && pageResponse.ok) {
                const health = await healthResponse.json();
                const html = await pageResponse.text();
                lastObservedCommit = health.commit || 'missing';

                if (
                  health.status === 'ok' &&
                  health.commit === expectedSha &&
                  health.database === 'connected' &&
                  html.includes(expectedAsset)
                ) {
                  appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + previewUrl.origin + String.fromCharCode(10));
                  appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + expectedSha + String.fromCharCode(10));
                  console.log('Verified stable branch Preview alias serves exact SHA ' + expectedSha + '.');
                  console.log('Health, connected database, and built frontend asset match this candidate.');
                  process.exit(0);
                }
              }
            } catch {
              // The alias can briefly serve the previous deployment while Vercel promotes the new Preview.
            }

            console.log('Waiting for Preview SHA ' + expectedSha + '; attempt ' + attempt + '/60; observed SHA: ' + lastObservedCommit);
            await sleep(10000);
          }

          throw new Error('Vercel branch alias did not serve exact SHA ' + expectedSha + '; last observed SHA: ' + lastObservedCommit);
          NODE

      - name: Verify QA credentials are configured
        if: steps.runtime.outputs.required == 'true'
        shell: bash
        env:
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [[ -z "$E2E_ADMIN_USER" || -z "$E2E_ADMIN_PASSWORD" ]]; then
            echo "::error::E2E_ADMIN_USER and E2E_ADMIN_PASSWORD must be configured to claim authenticated QA."
            exit 1
          fi
          echo "QA credentials are present; values are intentionally not logged."

      - name: Verify public smoke, authenticated dashboard and admin API
        if: steps.runtime.outputs.required == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test --config=playwright.deployment.config.ts --grep-invert "ownership, tenant spoofing, quarantine and pricing remain fail-closed|C1/C3/C4/C6|PDF/PPTX se persisten, se recuperan con autorización y la entrega queda auditada"

  qa-deployment-e2e:
    name: QA Deployment E2E · Neon QA
    # This job creates/updates one deterministic synthetic request and Media Kit in Neon QA.
    # Run once on the PR event, not again on the matching branch push.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'pmv-validation-candidate' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BASE_URL: https://grupo-comunicarte-refactoring-qa.onrender.com
      EXPECTED_QA_BRANCH: br-bold-block-aua43ua0
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build expected frontend artifact
        run: npm run build

      - name: Wait for Render QA to serve this frontend and the isolated Neon QA branch
        shell: bash
        run: |
          node <<'NODE'
          import { readFileSync } from 'node:fs';

          const base = process.env.PLAYWRIGHT_BASE_URL;
          const expectedBranch = process.env.EXPECTED_QA_BRANCH;
          const expectedAsset = readFileSync('dist/index.html', 'utf8')
            .split('"')
            .find((value) => value.startsWith('/assets/') && value.endsWith('.js'));

          if (!expectedAsset) throw new Error('Could not identify the built frontend asset.');

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastHealth = null;

          for (let attempt = 1; attempt <= 60; attempt++) {
            try {
              const [healthResponse, pageResponse] = await Promise.all([
                fetch(new URL('/api/health', base), { signal: AbortSignal.timeout(15000) }),
                fetch(base, { signal: AbortSignal.timeout(15000) }),
              ]);

              if (healthResponse.ok && pageResponse.ok) {
                const health = await healthResponse.json();
                const html = await pageResponse.text();
                lastHealth = health;

                if (
                  health.status === 'ok' &&
                  health.database === 'connected' &&
                  health.databaseBranch === expectedBranch &&
                  html.includes(expectedAsset)
                ) {
                  console.log('Render QA serves the expected frontend asset and isolated Neon QA branch.');
                  process.exit(0);
                }
              }
            } catch {
              // Render may still be deploying the candidate.
            }

            console.log('Waiting for Render QA candidate; attempt ' + attempt + '/60.');
            await sleep(10000);
          }

          throw new Error('Render QA did not serve the expected build and Neon branch. Last health: ' + JSON.stringify(lastHealth));
          NODE

      - name: Verify QA credentials are configured
        shell: bash
        env:
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [[ -z "$E2E_ADMIN_USER" || -z "$E2E_ADMIN_PASSWORD" ]]; then
            echo "::error::E2E_ADMIN_USER and E2E_ADMIN_PASSWORD must be configured to run authenticated QA."
            exit 1
          fi
          echo "QA credentials are present; values are intentionally not logged."

      - name: Run full authenticated PMV E2E against Neon QA
        env:
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test --config=playwright.deployment.config.ts

      - name: Upload QA E2E evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: qa-deployment-e2e-evidence
          path: |
            test-results/deployment/
            playwright-report/
          retention-days: 14
